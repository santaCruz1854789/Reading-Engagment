<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8"><title>My reader</title>
    </head>
    <body>
        <h1>EPub Reader</h1>
        <Button id="prev">Prev</Button>
        <button id="next">Next</button>
        <span id="info"></span>

        <script>
        let nextCount = 0;
        let prevCount = 0;
        
        document.getElementById("next").addEventListener("click", () =>{
            nextCount = nextCount + 1;
            document.getElementById("info").textContent = "next: " + nextCount + "| prev:" + prevCount;
        });

        document.getElementById("prev").addEventListener("click", () => {
            prevCount = prevCount + 1;
            document.getElementById("info").textContent = "next: " + nextCount + "| prev:" + prevCount;
        });
        </script>
    </body>

</html>
