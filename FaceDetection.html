<!DOCTYPE html>
<html>
<head>
    <title>FaceDetectionApplet</title> 
    
</head>
<body>
    <h1>Face Detection App</h1>
    <video id="video" autoplay playsinline muted></video>
    <span id="blinkLog"></span>
    <span id="eyeOpenLog"></span>
    <span id="blinksPerMinute"></span>
    <script type="module">
        import {FaceLandmarker, FilesetResolver}
        from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        const REOPEN_THRESHOLD = 0.31;
        const CLOSE_THRESHOLD = 0.18; // Perfect threshold
        const LONG_CLOSURE_SECONDS = 3;
        const WINDOW_SECONDS_INTERVAL = 10;

        let isClosed = false;
        let blinkTimestamp = []
        let longClosureCount = 0;
        let frameCounter = 0;
        let blinkTime = 0;
        let isLongClosureCounted = false;
        let blinksPerMinute = 0;
        let closureTime = 0;
        let slidingWindowBlinkList = [];

        let faceFound = false;

        const video = document.getElementById("video");

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

        const faceLandmarker = await FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath: "app/shared/models/face_landmarker.task",
                    delegate: "GPU",
                },
                runningMode: "VIDEO",
                numFaces: 1,
            }
        );
        console.log("Landmarker ready!");

        let lastVideoTime = -1;
        let results = undefined;

        function takeSnapshot() {
            const now = Date.now();
            blinksPerMinute = blinkTimestamp.filter(t => t >= now - 60000).length;
            slidingWindowBlinkList.push(blinksPerMinute);
            document.getElementById("blinksPerMinute").textContent =
                "Blink per minute list: " + slidingWindowBlinkList;
        }

        function getEyeAspectRatios(landmark, eyeChosen) {
            let eye_top = 0;
            let bottom = 0;
            let inner = 0;
            let outer = 0;
            
            if (eyeChosen === "left") {
                eye_top = 386;
                bottom = 374;
                inner = 362;
                outer = 263; 
            }
            else if (eyeChosen === "right") {
                eye_top = 159;
                bottom = 145;
                inner = 133;
                outer = 33;
            }
            else {
                console.error("Choose either \"left\" or \"right\" on the eyeChosen argument");
                return;
            }

            let vertical3D = PythDistance3D(landmark[eye_top], landmark[bottom]);
            let horizontal3D = PythDistance3D(landmark[outer], landmark[inner]);

            let vertical2D = PythDistance2D(landmark[eye_top], landmark[bottom]);
            let horizontal2D = PythDistance2D(landmark[outer], landmark[inner]);

            let horizontalAbs = AbsDistanceHorizontal(landmark[outer], landmark[inner]);
            let verticalAbs = AbsDistanceVertical(landmark[eye_top], landmark[bottom]);
            
            return [vertical3D/horizontal3D, vertical2D/horizontal2D, verticalAbs/horizontalAbs];
        }

        function PythDistance3D(pA, pB) {
            return Math.sqrt((pA.x - pB.x)**2 + (pA.y - pB.y)**2 + (pA.z - pB.z)**2)
        }
        function PythDistance2D(pA, pB) {
            return Math.sqrt((pA.x - pB.x)**2 + (pA.y - pB.y)**2)
        }
        function AbsDistanceVertical(pA, pB) {
            return Math.abs(pA.y - pB.y)
        }
        function AbsDistanceHorizontal(pA, pB) {
            return Math.abs(pA.x - pB.x)
        }

        function getEyeAspectRationAvg (landmark, type) {
            if (type === "2d") {
                return (getEyeAspectRatios(landmark, "left")[1] + getEyeAspectRatios(landmark, "right")[1])/2;}
            if (type === "3d") {
                return (getEyeAspectRatios(landmark, "left")[0] + getEyeAspectRatios(landmark, "right")[0])/2;}
            return;
        }

        function renderLoop() {
            if(video.currentTime != lastVideoTime) {
                lastVideoTime = video.currentTime;
                results = faceLandmarker.detectForVideo(video, performance.now());

                if(results.faceLandmarks.length > 0) {
                    if(faceFound == false) {
                        console.log("Face Found!")
                        faceFound = true
                    }
                    const landmark = results.faceLandmarks[0];
                    let EAR = getEyeAspectRationAvg(landmark, "3d")

                    if(EAR <= CLOSE_THRESHOLD)
                    {
                        console.log("Closed beyond threshold");
                        if(isClosed === false) {
                            isClosed = true;
                            closureTime = Date.now();
                        }
                        if(!isLongClosureCounted && (Date.now() - closureTime) >= LONG_CLOSURE_SECONDS *1000) {
                            longClosureCount += 1;
                            isLongClosureCounted = true;
                        }
                    }
                    if(EAR > REOPEN_THRESHOLD && isClosed === true) {
                        console.log("Opened beyond threshold");
                        const openTime = Date.now();
                        isClosed = false;
                        isLongClosureCounted = false;
                        if((openTime - closureTime) <= 700) {
                            blinkTime = Date.now();
                            blinkTimestamp.push(blinkTime)
                        }
                        // Sliding window that keep track of how many blinks per minute
                    }
                    blinksPerMinute = blinkTimestamp.filter((timestamp) => timestamp >= (Date.now() - 60000)).length;
                    
                    document.getElementById("blinkLog").textContent = "Number of blinks: " + blinkTimestamp.length;
                    document.getElementById("eyeOpenLog").textContent = "Number of eye Long Closure " + longClosureCount;
                }
                else {
                    if(faceFound == true) {
                        console.log("Face Lost...")
                        faceFound = false
                    }
                }
            }
            requestAnimationFrame(async () => {
                //await sleep(2000);
                renderLoop();  
            });
        };
        
        navigator.mediaDevices.getUserMedia({
            video:true
        }).then( (stream) => {
            video.srcObject = stream;
            video.addEventListener("loadeddata", renderLoop)
            document.getElementById("blinksPerMinute").textContent = "Waiting for data...";
            takeSnapshot();                                          // first value right away
            setInterval(takeSnapshot, WINDOW_SECONDS_INTERVAL * 1000);
        }).catch( (err) => {
            console.error("Camera Error", err);
        });

    </script>
</body>

</html>
